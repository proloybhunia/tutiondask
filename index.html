<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>TuitionDesk</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f766e"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#f4f6f5;--card:#fff;--tx:#14231f;--mut:#667a74;--pri:#0f766e;--prit:#fff;--bd:#dfe7e4;--red:#c2410c;--redb:#ffedd5;--grn:#15803d;--grnb:#dcfce7}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1614;--card:#17221f;--tx:#e8f1ee;--mut:#97aaa4;--pri:#2dd4bf;--prit:#04201c;--bd:#26352f;--red:#fdba74;--redb:#3a1f0c;--grn:#86efac;--grnb:#0f2e1a}}
:root[data-theme="dark"]{--bg:#0e1614;--card:#17221f;--tx:#e8f1ee;--mut:#97aaa4;--pri:#2dd4bf;--prit:#04201c;--bd:#26352f;--red:#fdba74;--redb:#3a1f0c;--grn:#86efac;--grnb:#0f2e1a}
*{box-sizing:border-box;-webkit-touch-callout:none}html,body{margin:0;height:100%}body{-webkit-user-select:none;user-select:none}input,select{-webkit-user-select:text;user-select:text}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;max-width:520px;margin:auto}
header{padding:14px 16px 8px;display:flex;justify-content:space-between;align-items:baseline}
header b{font-size:20px}header span{color:var(--mut);font-size:13px}
main{flex:1;overflow-y:auto;padding:4px 14px 16px}
nav{display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:8px 0 7px;font-size:11px;font-family:inherit}
nav button i{display:block;font-style:normal;font-size:20px}nav button.on{color:var(--pri);font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:10px 0}
h3{margin:14px 2px 4px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.sub{color:var(--mut);font-size:13px}
.btn{width:100%;border:0;border-radius:12px;background:var(--pri);color:var(--prit);font:600 16px inherit;font-family:inherit;padding:14px;margin:6px 0}
.btn.ghost{background:none;color:var(--pri);border:1.5px solid var(--pri)}
.chip{border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--redb);color:var(--red);white-space:nowrap}
.chip.g{background:var(--grnb);color:var(--grn)}
.big{font-size:30px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .card{margin:0}
.pa{display:flex;gap:6px}.pa button{width:44px;height:40px;border-radius:10px;border:1.5px solid var(--bd);background:none;color:var(--mut);font:700 15px inherit;font-family:inherit}
.pa .p.on{background:var(--grn);color:#fff;border-color:var(--grn)}.pa .a.on{background:#c2410c;color:#fff;border-color:#c2410c}
select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin:6px 0}
.bar{height:10px;border-radius:6px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.in{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin:4px 0}
.dbtn{padding:9px 12px;margin:3px;border-radius:10px;border:1.5px solid var(--bd);background:none;color:var(--mut);font:600 14px inherit;font-family:inherit}.dbtn.on{background:var(--pri);color:var(--prit);border-color:var(--pri)}
.ic{border:0;background:var(--grnb);color:var(--grn);border-radius:10px;padding:7px 10px;font-weight:600;font-family:inherit}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#14231f;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:88%;text-align:center;opacity:0;transition:.25s;pointer-events:none}
#toast.s{opacity:1}
</style></head><body>
<header><b><img id="lg" alt="" style="display:none;width:28px;height:28px;border-radius:8px;object-fit:cover;vertical-align:middle;margin-right:8px"><span id="at">TuitionDesk</span></b><span id="cn">Sunrise Tuition Centre</span></header>
<main id="m"></main>
<nav id="n"></nav><div id="toast"></div><div id="sh" style="display:none"></div>
<script>
var S=[
{n:"Aarav Sharma",c:"Class 9",p:"919800000001",pend:3000,late:14,att:92,sc:[58,64,66,71,74,81]},
{n:"Diya Patel",c:"Class 9",p:"919800000002",pend:0,late:0,att:97,sc:[80,84,79,88,90,92]},
{n:"Rohan Verma",c:"Class 9",p:"919800000003",pend:6000,late:35,att:78,sc:[45,52,48,55,50,58]},
{n:"Ananya Singh",c:"Class 9",p:"919800000004",pend:3000,late:6,att:95,sc:[70,72,75,73,79,83]},
{n:"Kabir Khan",c:"Class 9",p:"919800000005",pend:0,late:0,att:88,sc:[62,60,67,70,69,72]},
{n:"Meera Iyer",c:"Class 9",p:"919800000006",pend:3000,late:2,att:90,sc:[75,78,74,80,82,85]},
{n:"Siddharth Rao",c:"Class 9",p:"919800000007",pend:0,late:0,att:84,sc:[55,61,63,60,66,68]},
{n:"Isha Gupta",c:"Class 9",p:"919800000008",pend:3000,late:21,att:93,sc:[68,71,70,76,77,79]}];
var HW=["Maths: Algebra Ex. 4.2, Q1 to Q8 (due tomorrow)","Science: Draw and label the plant cell","English: Write a 120-word paragraph on My Hero"];
var EQ=[["Neha Joshi","Class 8","Referred by Diya Patel"],["Arjun Mehta","Class 10","Referred by Meera Iyer"],["Pooja Nair","Class 9","Referred by Aarav Sharma"]];
var tabs=[["Fees","💰"],["Attendance","✅"],["Tests","📝"],["Parent","👪"],["Owner","📊"]];
var tab=0,sel=0,remSent=false,saved=false,mk=S.map(function(){return"P"}),cfg={name:"Sunrise Tuition Centre",upi:"sunrisetuition@upi"},today=new Date().toDateString();
try{var D=JSON.parse(localStorage.getItem("td1")||"null");if(D){S=D.S;cfg=D.cfg;mk=D.d==today?D.mk:S.map(function(){return"P"});if(D.EQ)EQ=D.EQ;if(D.H)H=D.H;if(D.HW2)HWL=D.HW2;if(D.PL)PL=D.PL;}}catch(e){}
var DB=null,lastJ="";
function sv(){var j=JSON.stringify({S:S,mk:mk,cfg:cfg,EQ:EQ,H:H,HW2:HWL,PL:PL,d:today});try{localStorage.setItem("td1",j)}catch(e){}if(DB&&j!==lastJ){lastJ=j;DB.doc("centre/main").set({json:j}).catch(function(){})}}
function initDb(){try{claude.use("db").then(function(d){if(!d)return;DB=d;d.doc("centre/main").onSnapshot(function(s){var x=s.exists&&s.data();if(!x||!x.json){lastJ="";go();return}if(x.json===lastJ)return;try{var o=JSON.parse(x.json);S=o.S;cfg=o.cfg;if(o.EQ)EQ=o.EQ;if(o.H)H=o.H;if(o.HW2)HWL=o.HW2;if(o.PL)PL=o.PL;mk=o.d==today?o.mk:S.map(function(){return"P"});lastJ=x.json;go()}catch(e){}},function(){})}).catch(function(){})}catch(e){}}
function g(i){return document.getElementById(i)}
var eb=false,cur=0,eid=0;
function bt(id){return cfg.bt.filter(function(b){return b.id==id})[0]}
function mig(){if(!cfg.bt||!cfg.bt.length)cfg.bt=[{id:1,name:cfg.batch||"Class 9 · Evening batch",time:cfg.time||"4:00 PM",fee:cfg.mf||3000}];S.forEach(function(s){if(!s.b)s.b=cfg.bt[0].id});if(!cur||!bt(cur))cur=cfg.bt[0].id}
function saveAtt2(){saved=true;toast("Attendance saved");go()}
function absMsg(i){return"Dear Parent, "+S[i].n+" was absent today ("+new Date().toLocaleDateString("en-IN",{day:"numeric",month:"short"})+") from "+bt(S[i].b).name+" at "+cfg.name+". Please let us know the reason. Thank you."}
function saveBt(){var n=g("bnm").value.trim(),t=g("btm").value.trim()||"-",f=+g("bfe").value.replace(/\D/g,"")||0;if(!n){toast("Enter batch name");return}var e=bt(eid);if(e){e.name=n;e.time=t;e.fee=f}else{var id=Date.now()%1000000000;cfg.bt.push({id:id,name:n,time:t,fee:f});cur=id}eid=0;toast("Batch saved");go()}
function delB(id){if(S.some(function(s){return s.b==id})){toast("Remove its students first");return}if(cfg.bt.length<2){toast("Keep at least one batch");return}cfg.bt=cfg.bt.filter(function(b){return b.id!=id});go()}
function delSt(i){S.splice(i,1);mk.splice(i,1);toast("Student removed");go()}
function bcard(){var e=bt(eid)||{name:"",time:"",fee:""};return'<h3>Batches</h3><div class="card">'+cfg.bt.map(function(x){var n=S.filter(function(s){return s.b==x.id}).length;return'<div class="row"><div><b>'+x.name+'</b><div class="sub">'+x.time+' · '+inr(x.fee)+'/month · '+n+' students</div></div><div><button class="ic" onclick="eid='+x.id+';go()">Edit</button> <button class="ic" onclick="delB('+x.id+')">Remove</button></div></div>'}).join("")+'</div><div class="card"><b>'+(eid?"Edit batch":"Add batch")+'</b><input id="bnm" class="in" placeholder="Batch name, e.g. Class 10 Science" value="'+e.name.replace(/"/g,"&quot;")+'"><input id="btm" class="in" placeholder="Time, e.g. 5:30 PM" value="'+String(e.time).replace(/"/g,"&quot;")+'"><input id="bfe" class="in" type="text" inputmode="numeric" placeholder="Monthly fee for this batch" value="'+(e.fee||"")+'"><button class="btn" onclick="saveBt()">'+(eid?"Save changes":"Add batch")+'</button>'+(eid?'<button class="btn ghost" onclick="eid=0;go()">Cancel</button>':'')+'</div>'}
function stList(){return'<h3>Students</h3><div class="card">'+(S.length?S.map(function(s,i){return'<div class="row"><div><b>'+s.n+'</b><div class="sub">'+(bt(s.b)?bt(s.b).name:"")+' · '+inr(s.mf||(bt(s.b)&&bt(s.b).fee)||cfg.mf||3000)+'/month</div></div><button class="ic" onclick="delSt('+i+')">Remove</button></div>'}).join(""):'<div class="sub">No students yet</div>')+'</div>'}
function att2(){var b=bt(cur),idx=[];S.forEach(function(s,i){if(s.b==cur)idx.push(i)});var ab=idx.filter(function(i){return mk[i]=="A"}),d=new Date().toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"short"});return'<select onchange="cur=+this.value;saved=false;go()">'+cfg.bt.map(function(x){return'<option value="'+x.id+'"'+(x.id==cur?" selected":"")+'>'+x.name+'</option>'}).join("")+'</select><div class="card"><b>'+b.name+'</b><div class="sub">'+d+' · '+b.time+'</div><div class="sub" style="margin-top:4px">Present '+(idx.length-ab.length)+' · Absent '+ab.length+'</div></div><div class="card">'+(idx.length?idx.map(function(i){return'<div class="row"><div>'+S[i].n+'</div><div class="pa"><button class="p'+(mk[i]=="P"?" on":"")+'" onclick="setM('+i+',\'P\')">P</button><button class="a'+(mk[i]=="A"?" on":"")+'" onclick="setM('+i+',\'A\')">A</button></div></div>'}).join(""):'<div class="sub">No students in this batch yet. Add them in the Owner tab.</div>')+'</div><button class="btn" onclick="saveAtt2()">Save attendance</button>'+(saved?'<div class="card"><div class="sub">Absent today. Tap WhatsApp to inform the parent:</div>'+(ab.length?ab.map(function(i){return'<div class="row"><span>'+S[i].n+'</span><button class="ic" onclick="sheet('+i+',2)">WhatsApp</button></div>'}).join(""):'<div style="padding:6px 0">No absentees today 🎉</div>')+'</div>':'')}
function saveB(){cfg.batch=g("bn").value.trim()||cfg.batch;cfg.time=g("bt").value.trim()||cfg.time;eb=false;toast("Batch saved");go()}
function delEq(k){EQ.splice(k,1);go()}
function addEq(){var n=g("en").value.trim(),c=g("ec").value.trim()||"Class not given",r=g("er").value.trim();if(!n){toast("Enter the student name");return}EQ.unshift([n,c,r?"Referred by "+r:"Other enquiry"]);toast("Enquiry added");go()}
function eqForm(){return'<h3>Add enquiry</h3><div class="card"><input id="en" class="in" placeholder="Student name"><input id="ec" class="in" placeholder="Class, e.g. Class 8"><input id="er" class="in" placeholder="Referred by (optional)"><button class="btn" onclick="addEq()">Add enquiry</button></div>'}
function gf(){var e=g("ns");if(e){e.scrollIntoView({block:"center"});e.focus()}}
function paid(i){S[i].pend=0;S[i].late=0;toast(S[i].n+" marked paid");go()}
function setDue(){var v=g("fa").value.replace(/\D/g,""),d=+g("fl").value.replace(/\D/g,"")||0;if(!S.length||!v||+v<=0){toast("Enter the fee amount");return}S[sel].pend=+v;S[sel].late=d;toast("Fee due set for "+S[sel].n);go()}
function addSc(){var v=g("ns").value;if(v===""||isNaN(+v)||+v<0||+v>100){toast("Enter a score from 0 to 100");return}S[sel].sc.push(+v);S[sel].sc.shift();toast("Score added");go()}
function saveCfg(){cfg.title=g("ctl").value.trim()||"TuitionDesk";cfg.name=g("cnm").value.trim()||cfg.name;cfg.upi=g("cup").value.trim()||cfg.upi;cfg.mf=+g("cmf").value.replace(/\D/g,"")||cfg.mf||3000;toast("Settings saved");go()}
function addSt(){var n=g("an").value.trim(),p=g("ap").value.replace(/\D/g,""),f=+g("af").value||0;p=p.replace(/^0+/,"");if(p.length==10)p="91"+p;if(!n||p.length<12){toast("Enter name and 10-digit mobile number");return}S.push({n:n,c:"Class 9",p:p,pend:f,late:f?1:0,att:100,b:+g("ab").value,mf:+g("am").value.replace(/\D/g,"")||(bt(+g("ab").value)||{}).fee||cfg.mf||3000,sc:[0,0,0,0,0,0]});mk.push("P");toast(n+" added");go()}
function clearS(){S=[];mk=[];sel=0;toast("All students removed");go()}
function setup(){var f='padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;width:100%;margin:4px 0',q=cfg.name.replace(/"/g,"&quot;"),u=cfg.upi.replace(/"/g,"&quot;");return'<h3>Centre settings</h3><div class="card"><input id="ctl" style="'+f+'" placeholder="App name shown at top" value="'+(cfg.title||"TuitionDesk").replace(/"/g,"&quot;")+'"><input id="cnm" style="'+f+'" placeholder="Centre name" value="'+q+'"><input id="cup" style="'+f+'" placeholder="UPI ID for fees" value="'+u+'"><input id="cmf" type="number" style="'+f+'" placeholder="Default monthly fee per student" value="'+(cfg.mf||3000)+'"><button class="btn ghost" onclick="saveCfg()">Save settings</button></div><h3>Centre logo</h3><div class="card"><input type="file" accept="image/*" onchange="setLogo(this)" class="in"><button class="btn ghost" onclick="rmLogo()">Remove logo</button></div><h3>Add student</h3><div class="card"><div class="sub">Tap the batches this student attends</div><div id="sbs">'+cfg.bt.map(function(x){return'<button class="dbtn" id="sb'+x.id+'" onclick="tgb('+x.id+')">'+x.name+'</button>'}).join("")+'</div><input id="an" style="'+f+'" placeholder="Student name"><input id="ap" type="tel" style="'+f+'" placeholder="Parent WhatsApp number (10 digits)"><input id="af" type="number" style="'+f+'" placeholder="Pending fee in rupees, 0 if paid"><input id="am" type="number" style="'+f+'" placeholder="Monthly fee (leave blank to use batch fee)"><button class="btn" onclick="addSt()">Add student</button><button class="btn ghost" onclick="clearS()">Remove all students (start fresh)</button></div>'}
var inr=function(x){return"₹"+x.toLocaleString("en-IN")};
function wl(p,t){return"https://wa.me/"+p+"?text="+encodeURIComponent(t)}
function shut(){g("sh").style.display="none"}
function cn2(){var e=document.createElement("textarea");e.value="+"+window.lp;e.style.position="fixed";e.style.opacity="0";document.body.appendChild(e);e.focus();e.select();var ok=false;try{ok=document.execCommand("copy")}catch(x){}document.body.removeChild(e);toast(ok?"Number copied":"Number: +"+window.lp)}
function cp(){var e=g("mt");e.focus();e.select();e.setSelectionRange(0,99999);var ok=false;try{ok=document.execCommand("copy")}catch(x){}toast(ok?"Copied. Now paste it in WhatsApp":"Press and hold the text, then tap Copy")}
function sheet(i,k){var s=S[i],t=k==2?absMsg(i):k?reportMsg():msgFee(s),h=g("sh"),lp0=(window.lp=s.p),b=t.replace(/&/g,"&amp;").replace(/</g,"&lt;"),bs="display:block;text-align:center;text-decoration:none";h.style.display="block";h.innerHTML='<div style="position:fixed;inset:0;background:rgba(0,0,0,.45)" onclick="shut()"></div><div class="card" style="position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));margin:0;max-height:85%;overflow:auto"><b>Send to '+s.n+'’s parent</b><div class="sub">WhatsApp number: +'+s.p+'</div><textarea id="mt" readonly style="width:100%;height:110px;margin:8px 0;padding:8px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;-webkit-user-select:text;user-select:text">'+b+'</textarea><a class="btn" style="'+bs+'" href="'+wl(s.p,t)+'" target="_blank" rel="noopener">Open WhatsApp</a><button class="btn ghost" onclick="cp()">Copy message</button><button class="btn ghost" onclick="cn2()">Copy number</button><button class="btn ghost" onclick="shut()">Close</button></div>'}
function reportMsg(){var s=S[sel];return"*Weekly Test Report* – "+cfg.name+"\nStudent: "+s.n+"\nScore: "+s.sc[5]+"/100\nClass rank: "+rank(sel)+" of "+S.length+"\nLast 6 tests: "+s.sc.join(", ")}
function wa(p,t){window.open("https://wa.me/"+p+"?text="+encodeURIComponent(t),"_blank")}
function toast(t){var e=document.getElementById("toast");e.textContent=t;e.className="s";setTimeout(function(){e.className=""},2600)}
function picker(){return'<select onchange="sel=+this.value;go()">'+S.map(function(s,i){return'<option value="'+i+'"'+(i==sel?" selected":"")+'>'+s.n+(bn(s)?" · "+bn(s):"")+'</option>'}).join("")+"</select>"}
function rank(i){var o=S.map(function(s,j){return[s.sc[5],j]}).sort(function(a,b){return b[0]-a[0]});for(var k=0;k<o.length;k++)if(o[k][1]==i)return k+1}
function pendList(){return S.filter(function(s){return s.pend>0}).sort(function(a,b){return b.late-a.late})}
function fees(){var l=pendList(),t=l.reduce(function(a,s){return a+s.pend},0);
return'<div class="card"><div class="sub">Total pending</div><div class="big">'+inr(t)+'</div><div class="sub">'+l.length+' students</div></div>'+
'<h3>Set fee due</h3><div class="card">'+(S.length?picker()+'<input id="fa" class="in" type="text" inputmode="numeric" placeholder="Fee due in rupees, e.g. 1500"><input id="fl" class="in" type="text" inputmode="numeric" placeholder="Days late (optional)"><button class="btn" onclick="setDue()">Set fee due</button><button class="btn ghost" onclick="recPay()">Record payment received (uses amount above)</button>':'<div class="sub">Add students in the Owner tab first.</div>')+'</div><button class="btn" onclick="remindAll()">'+"Send reminders: tap each parent below"+'</button>'+
'<div class="card">'+l.map(function(s){var i=S.indexOf(s);return'<div class="row"><div><b>'+s.n+'</b><div class="sub">'+(bn(s)?bn(s)+' · ':'')+inr(s.pend)+' pending</div></div><div style="text-align:right"><span class="chip">'+(s.late?s.late+' days late':'Due now')+'</span><div style="margin-top:6px"><button class="ic" onclick="sheet('+i+',0)">WhatsApp</button> <button class="ic" onclick="paid('+i+')">Paid ✓</button></div></div></div>'}).join("")+(l.length?"":"<div class=\"sub\" style=\"padding:8px 0\">No pending fees 🎉</div>")+"</div>"}
function msgFee(s){return"Dear Parent, fee of "+inr(s.pend)+" for "+s.n+" is pending for "+s.late+" days at "+cfg.name+". Kindly pay at the earliest. Thank you."}
function remOne(i){wa(S[i].p,msgFee(S[i]))}
function remAll(){}
function remindAll(){toast("Tap WhatsApp next to each parent to send");var e=document.querySelector(".ic");if(e)e.scrollIntoView({block:"center"})}
function att(){var a=mk.filter(function(x){return x=="A"}).length,d=new Date().toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"short"});
return'<div class="card"><div class="row" style="border:0;padding:0"><b>'+(cfg.batch||"Class 9 · Evening batch")+'</b><button class="ic" onclick="eb=!eb;go()">'+(eb?"Close":"Edit")+'</button></div><div class="sub">'+d+' · '+(cfg.time||"4:00 PM")+'</div>'+(eb?'<input id="bn" class="in" placeholder="Batch name, e.g. Class 10 Maths" value="'+(cfg.batch||"Class 9 · Evening batch").replace(/"/g,"&quot;")+'"><input id="bt" class="in" placeholder="Time, e.g. 5:30 PM" value="'+(cfg.time||"4:00 PM").replace(/"/g,"&quot;")+'"><button class="btn" onclick="saveB()">Save batch</button>':'')+'<div class="sub" style="margin-top:4px">Present '+(S.length-a)+' · Absent '+a+'</div></div><div class="card">'+

function att2(){var t=new Date().getDay(),b=bt(cur),idx=[];S.forEach(function(s,i){if(inB(s,cur))idx.push(i)});var K=function(i){return S[i].id+"_"+cur},ab=idx.filter(function(i){return mk[K(i)]=="A"}),d=new Date().toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"short"}),o=cfg.bt.slice().sort(function(x,y){return(y.days[t]?1:0)-(x.days[t]?1:0)});return'<select onchange="cur=+this.value;saved=false;go()">'+o.map(function(x){return'<option value="'+x.id+'"'+(x.id==cur?" selected":"")+'>'+esc(x.name)+(x.days[t]?' · Today '+x.days[t]:'')+'</option>'}).join("")+'</select><div class="card"><b>'+esc(b.name)+'</b><div class="sub">'+d+' · '+(b.days[t]?'Today at '+b.days[t]:'Not scheduled today ('+sched(b)+')')+'</div><div class="sub" style="margin-top:4px">Present '+(idx.length-ab.length)+' · Absent '+ab.length+'</div></div><div class="card">'+(idx.length?idx.map(function(i){return'<div class="row"><div>'+esc(S[i].n)+'</div><div class="pa"><button class="p'+(mk[K(i)]!="A"?" on":"")+'" onclick="setM('+i+',\'P\')">P</button><button class="a'+(mk[K(i)]=="A"?" on":"")+'" onclick="setM('+i+',\'A\')">A</button></div></div>'}).join(""):'<div class="sub">No students in this batch yet. Add them in the Owner tab.</div>')+'</div><button class="btn" onclick="saveAtt2()">Save attendance</button>'+(saved?'<div class="card"><div class="sub">Absent today. Tap WhatsApp to inform the parent:</div>'+(ab.length?ab.map(function(i){return'<div class="row"><span>'+esc(S[i].n)+'</span><button class="ic" onclick="sheet('+i+',2)">WhatsApp</button></div>'}).join(""):'<div style="padding:6px 0">No absentees today 🎉</div>')+'</div>':'')+'<h3>Homework for this batch</h3><div class="card"><input id="hwt" class="in" placeholder="e.g. Chapter 4, questions 1 to 6"><button class="btn" onclick="addHw()">Add homework</button>'+HWL.map(function(h,k){return h.b==cur?'<div class="row"><div>'+esc(h.t)+'<div class="sub">'+h.d+'</div></div><button class="ic" onclick="delHw('+k+')">Remove</button></div>':''}).join("")+'</div>'}
